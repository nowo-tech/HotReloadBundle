# REQ-TEST-011 — Demo smoke: boot FrankenPHP demos and assert HTTP 200.
name: Demo smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
  push:
    tags:
      - 'v*'

jobs:
  demo-smoke:
    name: Demo symfony8 smoke (HTTP 200)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Compose
        run: docker compose version

      - name: Cache Composer packages for the demo
        uses: actions/cache@v6
        with:
          path: /tmp/hot-reload-composer-cache
          key: ${{ runner.os }}-demo-composer-${{ hashFiles('demo/symfony8/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-demo-composer-

      - name: Run demo smoke (REQ-TEST-011)
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'
          COMPOSER_CACHE_DIR: /tmp/hot-reload-composer-cache
          COMPOSER_MAX_PARALLEL_HTTP: 1
        run: |
          mkdir -p "$COMPOSER_CACHE_DIR"
          make demo-smoke
